<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHFL Playground</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #404040;
        }
        header h1 { font-size: 16px; color: #569cd6; font-weight: 600; }
        .toolbar { display: flex; gap: 8px; align-items: center; }
        .toolbar button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .toolbar button:hover { background: #1177bb; }
        .toolbar button:disabled { background: #3c3c3c; cursor: wait; }
        .toolbar button.btn-secondary {
            background: #3c3c3c;
            color: #d4d4d4;
        }
        .toolbar button.btn-secondary:hover { background: #4c4c4c; }
        .toolbar select {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            background: #252526;
            padding: 6px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            border-bottom: 1px solid #404040;
        }
        .panel-content {
            flex: 1;
            overflow: auto;
        }
        #editor-container { background: #1e1e1e; }
        #output {
            background: #1a1a1a;
            padding: 12px 16px;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        #output-content { white-space: pre-wrap; word-break: break-word; }
        #output-content.success, #output-content.error { white-space: normal; }

        /* Result summary */
        .result-summary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .result-ok { background: rgba(100, 170, 100, 0.12); color: #89d185; }
        .result-fail { background: rgba(244, 135, 113, 0.12); color: #f48771; }
        .result-icon { font-size: 16px; font-weight: bold; }
        .result-text { font-weight: 600; font-size: 14px; }
        .result-count { font-size: 12px; opacity: 0.8; }
        .result-time { margin-left: auto; font-size: 11px; opacity: 0.6; }

        /* Stats bar */
        .result-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            margin-bottom: 12px;
            background: rgba(86, 156, 214, 0.08);
            border-radius: 4px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px;
            color: #569cd6;
        }
        .stat-sep { opacity: 0.4; }

        /* Diagnostics */
        .diag-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .diag {
            padding: 10px 12px;
            border-radius: 4px;
            border-left: 3px solid;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px;
        }
        .diag-error { background: rgba(244, 135, 113, 0.08); border-color: #f48771; }
        .diag-warning { background: rgba(220, 180, 80, 0.08); border-color: #dcb450; }
        .diag-note { background: rgba(86, 156, 214, 0.08); border-color: #569cd6; }
        .diag-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .diag-icon { font-size: 14px; }
        .diag-error .diag-icon { color: #f48771; }
        .diag-warning .diag-icon { color: #dcb450; }
        .diag-note .diag-icon { color: #569cd6; }
        .diag-level { font-weight: 600; font-size: 12px; text-transform: uppercase; }
        .diag-code { font-size: 11px; opacity: 0.7; }
        .diag-loc { margin-left: auto; font-size: 11px; opacity: 0.5; }
        .diag-message { color: #d4d4d4; }
        .diag-source {
            margin-top: 6px;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
            white-space: pre;
            overflow-x: auto;
        }
        .diag-source-line { color: #9cdcfe; }
        .diag-source-marker { color: #f48771; }
        .diag-clickable { cursor: pointer; transition: filter 0.15s; }
        .diag-clickable:hover { filter: brightness(1.3); }

        /* Verification section */
        .verify-section {
            margin-top: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(100, 170, 100, 0.3);
        }
        .verify-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(100, 170, 100, 0.12);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .verify-icon { color: #89d185; font-size: 18px; font-weight: bold; }
        .verify-title { font-weight: 600; font-size: 14px; color: #89d185; }
        .verify-body { padding: 10px 14px; }
        .verify-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
        }
        .verify-label { color: #888; }
        .verify-value { color: #d4d4d4; font-weight: 500; }
        .verify-ok { color: #89d185; }
        .verify-warn { color: #dcb450; }

        /* Build download */
        .build-download {
            padding: 12px;
            text-align: center;
        }
        .download-link {
            display: inline-block;
            padding: 8px 20px;
            background: #0e639c;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            font-weight: 500;
        }
        .download-link:hover { background: #1177bb; }
        .divider {
            width: 2px;
            background: #404040;
            cursor: col-resize;
        }
        .error { color: #f48771; }
        .success { color: #89d185; }
        .info { color: #569cd6; }
        footer {
            background: #007acc;
            padding: 4px 16px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <header>
        <h1>AHFL Playground</h1>
        <div class="toolbar">
            <select id="examples">
                <option value="">Load Example...</option>
                <option value="hello">Hello Agent</option>
                <option value="vending-machine">Vending Machine</option>
                <option value="multi-agent">Multi-Agent Pipeline</option>
            </select>
            <button id="btn-compile">Compile</button>
            <button id="btn-verify">Verify</button>
            <button id="btn-build">Build</button>
            <button id="btn-format">Format</button>
            <button id="btn-share">Share</button>
            <button id="btn-reset" class="btn-secondary">Reset</button>
        </div>
    </header>
    <main>
        <div class="panel">
            <div class="panel-header">Source</div>
            <div class="panel-content" id="editor-container"></div>
        </div>
        <div class="divider"></div>
        <div class="panel">
            <div class="panel-header">Output</div>
            <div class="panel-content" id="output">
                <div id="output-content" class="info">Ready. Write some AHFL code and click Compile.</div>
            </div>
        </div>
    </main>
    <footer>
        <span>AHFL Compiler (local ahflc)</span>
        <span id="status">Ready</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
