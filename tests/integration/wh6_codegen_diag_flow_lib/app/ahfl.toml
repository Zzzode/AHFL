manifest_version = 1

[package]
name = "wh6-diag-app"
version = "0.1.0"
edition = "2026"
kind = "application"

[module]
prefix = "app"
root = "."

[exports]
modules = ["main"]

[targets.workflow]
kind = "handoff"
entry = "app::main::CrossWorkflow"
exports = [
  { kind = "workflow", name = "app::main::CrossWorkflow" },
  { kind = "agent", name = "lib::agents::CrossAgent" },
]

[dependencies]
std = { source = "sysroot" }
wh6-diag-lib = { source = "path", path = "../lib", version = "0.1.0" }
