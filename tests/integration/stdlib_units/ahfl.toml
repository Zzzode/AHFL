manifest_version = 1

[package]
name = "stdlib-units"
version = "0.1.0"
edition = "2026"
kind = "library"

[module]
prefix = "stdlib_units"
root = "."

[exports]
modules = [
  "option_ut",
  "result_ut",
  "string_ut",
  "list_ut",
  "map_ut",
  "set_ut",
  "cmp_ut",
  "time_ut",
  "uuid_ut",
  "json_ut",
  "decimal_ut",
  "prelude_ut",
  "option_neg_map",
  "option_neg_unwrap_or",
  "option_neg_not_option",
  "option_neg_arity",
  "option_neg_unknown",
]

[targets.option-ut]
kind = "library"
entry = "option_ut.ahfl"

[targets.result-ut]
kind = "library"
entry = "result_ut.ahfl"

[targets.string-ut]
kind = "library"
