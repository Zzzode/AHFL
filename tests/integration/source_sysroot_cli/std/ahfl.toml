manifest_version = 1

[package]
name = "std"
version = "0.1.0"
edition = "2026"
kind = "standard-library"

[module]
prefix = "std"
root = "."

[prelude]
module = "std::prelude"
injection = "explicit"

[exports]
modules = [
  "prelude",
  "option",
  "collections",
  "json",
]

[compiler_intrinsics]
allow = ["fixture_*"]
